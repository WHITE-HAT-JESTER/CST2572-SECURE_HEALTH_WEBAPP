<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
</head>
<!-- data-role is set by script.js from ?role=patient|doctor|admin and drives the colours -->
<body data-role="patient">
  <div class="window">
    <img class="dna" src="..//images/dna.svg" alt="">

    <header class="bar">
      <a class="brand" href="index.html">
        <svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="bm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B5CFF"/><stop offset="1" stop-color="#D13FD0"/></linearGradient></defs><circle cx="16" cy="16" r="16" fill="url(#bm)"/><path d="M13 7h6v6h6v6h-6v6h-6v-6H7v-6h6z" fill="#fff"/></svg>
        X HOSPITAL
      </a>
    </header>

    <main class="hero">
      <div class="panel">
        <a class="back" href="index.html">Back to home</a>

        <div class="badge">
          <svg class="icon icon-patient" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="15" r="7"/><path d="M9 41c0-9 6.5-15 15-15s15 6 15 15"/></svg>
          <svg class="icon icon-doctor" viewBox="0 0 48 48" aria-hidden="true"><path d="M13 6v13a11 11 0 0 0 22 0V6"/><circle cx="13" cy="6" r="2.2" fill="currentColor"/><circle cx="35" cy="6" r="2.2" fill="currentColor"/><path d="M24 30v5a8 8 0 0 0 16 0v-3"/><circle cx="40" cy="28" r="4"/></svg>
          <svg class="icon icon-admin" viewBox="0 0 48 48" aria-hidden="true"><rect x="11" y="9" width="26" height="33" rx="3"/><rect x="18" y="5" width="12" height="7" rx="2"/><path d="M17 21h14M17 28h14M17 35h8"/></svg>
        </div>

        <h1 id="login-title"></h1>
        <p class="lead" id="login-lead">Book appointments, request prescriptions and read your medical notes.</p>

        <!-- Other team members: hook your code on #login-form (fields: username, email, password, role) -->
        <form id="login-form" action="#" method="post">
          <input type="hidden" id="role" name="role" value="patient">

          <label for="email">Email
            <input id="email" name="email" type="email" autocomplete="email" required>
          </label>

          <label for="password">Password
            <input id="password" name="password" type="password" autocomplete="current-password" required>
          </label>

          <button type="submit">Log in</button>
          <p id="form-message" class="message" role="status"></p>
        </form>

        <!-- Only patients can register (shown by script.js) -->
        <div id="register-box" class="register-box">
          <p>Dont' have an account?</p>
          <a class="btn secondary" href="register_page.html">Register</a>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/script.js"></script>
  <script src="..//js/db.js"></script>
</body>
</html>
