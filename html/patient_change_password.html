<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Patient Dashboard</title>
        <link rel="icon" href="..//images/favicon.jpeg" type="image/svg+xml">
        <link rel="stylesheet" href="../css/patient.css">
    </head>

    <body class="patient-dashboard" role="patient"> 
        <div id = "dashWindow">

            <header>
                <a id="hosp-logo" href="login_page.html">
                     <svg viewBox="0 0 32 32" aria-hidden="true">
                        <circle cx="16" cy="16" r="16" fill="currentColor"></circle>
                        <path d="M13 7h6v6h6v6h-6v6h-6v-6H7v-6h6z" fill="#fff"></path>
                    </svg>
                    X HOSPITAL
                </a>
                
                <nav  aria-label="Patient dashboard sections">
                    <h2 class="page-title">
                        Patient Change Password
                    </h2>

                    <div class="tabs patient-tabs">
                        <a class="tab" id="tabDash" aria-current="page" href="patient_page.html">Dashboard</a>
                        <a class="tab" id="tabBook" href="patient_booking.html">Booking</a>
                        <a  class="tab" id="tabPresc" href="patient_prescription_request.html">Prescription</a>
                    </div>  
                </nav>

                <button class="theme-toggle" id="theme-toggle"
                        type="button" aria-pressed="false">
                    <span id="theme-icon" aria-hidden="true"></span>
                    <span id="theme-text">Dark Mode</span>
                </button>
                <br>
            </header>

            <main class="password-main"> 

                <div id="patProfile">     
                    <h1>
                        Change Password
                    </h1>

                    <div class="profile-change-password">
                       <div class="profile-row">
                            <div class="profile" ><strong>  Current Password: </strong><input class="password-input" type="password" id="currentPassword" name="currentPassword"></div>
                            <div class="profile"><strong>  New Password:   </strong> <input class="password-input" type="password" id="newPassword" name="newPassword"></div>
                            <div class="profile" ><strong>  Confirm New Password:    </strong> <input class="password-input" type="password" id="confirmNewPassword" name="confirmNewPassword"></div>
                        </div>                        
                    </div>
                    <div id = "change_buttons">
                        <button id="changePasswordButton" class="change-password-btn">Change Password</button>
                        <button id="cancelButton" class="cancel-btn">Cancel</button>
                    </div>
                </div>

            </main>
        </div>

        <!-- SECURITY: DOMPurify first, then security.js (it throws if DOMPurify is missing) -->
        <script src="../lib/dompurify/purify.min.js"></script>
        <script src="../js/security.js"></script>

        <script src="../js/encryption.js"></script>
        <script src="../js/db.js"></script>
        <script src="../js/auth.js"></script>

        <script src="../js/patient.js"></script>

        <script src="../js/script.js"></script>
        <script src="../js/theme.js"></script>
    </body>
