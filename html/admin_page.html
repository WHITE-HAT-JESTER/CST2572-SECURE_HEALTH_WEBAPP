<!DOCTYPE html>
<html lang = en>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin page</title>
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/style.css">

</head>

<body class="admin-calendar-page" data-role="admin">
    <div class="window admin-calendar-window">
        <header class="bar">
            <a class="brand" href="index.html">
                <svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="bm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B5CFF"/><stop offset="1" stop-color="#D13FD0"/></linearGradient></defs><circle cx="16" cy="16" r="16" fill="url(#bm)"/><path d="M13 7h6v6h6v6h-6v6h-6v-6H7v-6h6z" fill="#fff"/></svg>
                X HOSPITAL
            </a>
        </header>
        <main class="admin-mochi-panel">
            <h1>ADMIN PAGE</h1>
            <p>Welcome, (admin name from database)</p>
            <a href = "admin_page_view_patient_info.html">go to patient data</a>
            <div id = monthButtons>
                <button onclick="PreviousMonth(currentMonth)">Previous Month</button>
                <button onclick="NextMonth(currentMonth)">Next Month</button>
            </div>
            <table id="Calendar">
                <thead>
                    <tr>
                        <th id = "monthHeader" colspan="7"></th>
                    </tr>
                    <tr>
                        <th>Sunday</th>
                        <th>Monday</th>
                        <th>Tuesday</th>
                        <th>Wednesday</th>
                        <th>Thursday</th>
                        <th>Friday</th>
                        <th>Saturday</th>
                    </tr>
                </thead>
                <tbody id="calendarBody">
                </tbody>
            </table>
            <p id="scheduleParagraph"></p>
            <ul id="scheduleList"></ul>
        </main>
    </div>
    <footer class="admin-calendar-footer">
        <p>&copy; 2026 X Hospital. All rights reserved.</p>
    </footer>
    
<script src="../js/admin.js"></script>
<script src="../js/theme.js"></script> 
</body>


</html>
