<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Patient Dashboard</title>
        <link rel="stylesheet" href="../css/patient.css">
        <script src="../lib/dompurify/purify.min.js"></script>

<script src="../js/security.js" defer></script>
<script src="../js/validation.js" defer></script>
    </head>

    <body class="patient-dashboard" role="patient"> 
        <div id="dashWindow">

            <!--booking appointment section-->
            <header>
                <a id="hosp-logo" href="login_page.html">
                    <svg viewBox="0 0 32 32" aria-hidden="true">
                        <circle cx="16" cy="16" r="16" fill="currentColor"></circle>
                        <path d="M13 7h6v6h6v6h-6v6h-6v-6H7v-6h6z" fill="#fff"></path>
                    </svg>
                    X HOSPITAL
                </a>
                
                <nav  aria-label="Patient dashboard sections">
                    <h2 class="page-title">
                        Book an Appointment with us
                    </h2>

                    <div class="tabs patient-tabs" >
                        <a class="tab" id="tabDash" href="patient_page.html">Dashboard</a>
                        <a class="tab" id="tabBook" aria-current="page" href="patient_booking.html">Booking</a>
                        <a class="tab" id="tabPresc" href="patient_prescription_request.html">Prescription</a>
                    </div> 
                </nav>
            </header>

            <main class ="patient-main">
                <a class="back" href="patient_page.html">Back to home</a>

                <!-- department menu -->
                <section id="department-carousel" class="department">
                    <h2>Set Up Your Appointment</h2>
                    <p>We offer a variety of medical services and have a team of experienced professionals to help you.</p>
                    <ul>
                        <!--cardiology-->
                        <li>
                            <button type="button" 
                                    class="dept-btn" 
                                    department="Cardiology">
                                <img src="../images/cardiology.svg" 
                                    alt="" >
                                    <span>Cardiology</span>
                            </button>
                        </li>

                        <!--General Medicine-->
                        <li>
                            <button type="button" 
                                    class="dept-btn" 
                                    department="General Medicine">
                                <img src="../images/general-medicine.svg" 
                                    alt="" >
                                    <span>Gen. Medicine</span>
                            </button>
                        </li>

                        <!--Neurology-->
                        <li>
                            <button type="button" 
                                    class="dept-btn" 
                                    department="Neurology">
                                <img src="../images/neurology.svg" 
                                    alt="" >
                                    <span>Neurology</span>
                            </button>
                        </li>

                        <!--Orthopedics-->
                        <li>
                            <button type="button" 
                                    class="dept-btn" 
                                    department="Orthopedics">
                                <img src="../images/orthopedics.svg" 
                                    alt="" >
                                    <span>Orthopedics</span>
                            </button>
                        </li>

                        <!--Pediatrics-->
                        <li>
                            <button type="button" 
                                    class="dept-btn" 
                                    department="Pediatrics">
                                <img src="../images/pediatrics.svg" 
                                    alt="" >
                                    <span>Pediatrics</span>
                            </button>
                        </li>
                    </ul>
                </section><!-- end of department menu -->
            

                <!--booking form-->
                <section id="booking-form">
                    <div>
                        <form id="bookingForm" method="post">

                            <div class = "doctor-dropdown"><!--doctor dropdown-->
                                <label 
                                    class = "form-label" 
                                    for = "doctor">
                                    <strong> Doctor: </strong>
                                </label>
                                <select class = "form-input" id = "doctor" name = "doctor" required>
                                
                                    <option value = "" disabled selected></option>
                                    <option value="Dr. Merrily Harmson">Dr. Merrily Harmson - Cardiology</option>
                                    <option value="Dr. Coordell Toor">Dr. Coordell Toor - Neurology</option>
                                    <option value="Dr. Violante Rilton">Dr. Violante Rilton - Pediatrics</option>
                                    <option value="Dr. Ettie Beardsworth">Dr. Ettie Beardsworth - Orthopedics</option>
                                    <option value="Dr. Rad Philipard">Dr. Rad Philipard - Gen. Medicine</option>
                                </select>
                            </div><!--end of doctor dropdown-->

                            <div>
                                <label 
                                    class = "form-label" 
                                    for = "other-notes">
                                    <strong> Other Information: </strong>
                                </label>                              
                                <textarea 
                                    class = "form-textarea" 
                                    id = "other-notes" 
                                    name = "other-notes" 
                                    rows = "4" 
                                    placeholder="Please provide any additional information about your appointment request...">
                                </textarea>
                            </div><!--end of other information-->

                            <div>
                                <label class="form-label" for="date">
                                    <strong>Select Date:</strong> <br>
                                </label>
                                <input type="date" id="date" name="date" required>
                            </div>
                                
                            <div>
                                <label class="form-label" for="time">
                                    <strong>Select Time:</strong> <br>
                                </label>
                                <label for="appointmentTime">Select Time:</label>
                                    <select id="appointmentTime" name="appointmentTime" required>
                                        <option value="">-- Select a time --</option>
                                        <option value="08:00">08:00 AM</option>
                                        <option value="08:30">08:30 AM</option>
                                        <option value="09:00">09:00 AM</option>
                                        <option value="09:30">09:30 AM</option>
                                        <option value="10:00">10:00 AM</option>
                                        <option value="10:30">10:30 AM</option>
                                        <option value="11:00">11:00 AM</option>
                                        <option value="11:30">11:30 AM</option>
                                        <option value="12:00">12:00 PM</option>
                                        <option value="12:30">12:30 PM</option>
                                        <option value="13:00">01:00 PM</option>
                                        <option value="13:30">01:30 PM</option>
                                        <option value="14:00">02:00 PM</option>
                                        <option value="14:30">02:30 PM</option>
                                        <option value="15:00">03:00 PM</option>
                                        <option value="15:30">03:30 PM</option>
                                        <option value="16:00">04:00 PM</option>
                                        <option value="16:30">04:30 PM</option>
                                        <option value="17:00">05:00 PM</option>
                                        <option value="17:30">05:30 PM</option>
                                        <option value="18:00">06:00 PM</option>
                                        <option value="18:30">06:30 PM</option>
                                        <option value="19:00">07:00 PM</option>
                                        <option value="19:30">07:30 PM</option>
                                        <option value="20:00">08:00 PM</option>
                                    </select>
                            </div>

                            <!--booking button-->
                            <button type = "submit" 
                                id = "book-appointment" 
                                class = "booking-btn">
                                <strong>Book</strong>
                            </button>

                            <!--confirmation message-->
                            <div id = "confirmation-message"
                                role = "status" hidden>
                                All set! See you soon!
                            </div><!--end of confirmation-message-->
                        </form>
                    </div><!--end of booking form-->
                </section>
            </main><!--end of booking section-->

        </div>
            

        <!-- SECURITY: DOMPurify first, then security.js (it throws if DOMPurify is missing) -->
        <script src="../lib/dompurify/purify.min.js"></script>
        <script src="../js/security.js"></script>

        <script src="../js/encryption.js"></script>
        <script src="../js/db.js"></script>
        <script src="../js/auth.js"></script>

        <script src="../js/patient.js"></script>

        <script src="../js/script.js"></script>
        <script src="../js/theme.js"></script>
    </body>

    <footer style="text-align: center; background: #333; color: white; padding: 20px;">
        <p>&copy; 2026 X Hospital. All rights reserved.</p>
    </footer>
    
   
</html>
