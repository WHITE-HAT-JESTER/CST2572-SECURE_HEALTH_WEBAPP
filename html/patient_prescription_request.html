
<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Patient Dashboard</title>
        <link rel="stylesheet" href="../css/patient.css">
    </head>
    
    <body class="patient-dashboard" role="patient"> 
        <div id="dashWindow">

            <header >
                <a id="hosp-logo" href="login_page.html">
                    <svg viewBox="0 0 32 32" aria-hidden="true">
                        <circle cx="16" cy="16" r="16" fill="currentColor"></circle>
                        <path d="M13 7h6v6h6v6h-6v6h-6v-6H7v-6h6z" fill="#fff"></path>
                    </svg>
                    X HOSPITAL
                </a>
        
                <nav  aria-label="Patient dashboard sections">
                    <h2 class="page-title">
                        Request a Prescription
                    </h2>

                    <div class="tabs patient-tabs" >
                        <a class="tab" id="tabDash"  href="patient_page.html">Dashboard</a>
                        <a class="tab" id="tabBook" href="patient_booking.html">Booking</a>
                        <a  class="tab" id="tabPresc" aria-current="page" href="patient_prescription_request.html">Prescription</a>
                    </div> 
                </nav>
            </header>

            <main class = "patient-main">
                <a class="back" href="patient_page.html">Back to home</a>

                <section id = "requestPrescription">
                    <div id="prescription-form">
                    <p>Please fill out the form below to request your prescription with a doctor in your selected department.</p>
                            
                        <form  action="#" method="post">

                            <!--form fields-->
                            <h2> Prescription Form: </h2>

                            <div> <!--patient username-->
                                <label 
                                    class = "form-label" 
                                    for = "patient-name">
                                    <strong> Name: </strong>
                                </label>
                                <input 
                                    class = "form-input" 
                                    type = "text" 
                                    id = "patient-name" 
                                    name = "patient-name" 
                                    required>
                                </div><!--end of username-->
                    
                                <div><!--patient contact-->
                                    <label 
                                        class = "form-label" 
                                        for = "patient-contact">
                                        <strong> Phone: </strong>
                                    </label>
                                    <input 
                                        class = "form-input" 
                                        type = "tel" 
                                        id = "patient-contact" 
                                        name = "patient-contact" 
                                        required>
                                </div><!--end of contact-->

                                <div class = "doctor-dropdown"><!--doctor dropdown-->
                                    <label 
                                        class = "form-label" 
                                        for = "doctor">
                                        <strong> Doctor: </strong>
                                    </label>
                                    <select class = "form-input" id = "doctor" name = "doctor" required>
                                    
                                        <option value = "" disabled selected></option>
                                        <option value="dr-smith">Dr. Smith</option>
                                        <option value="dr-johnson">Dr. Johnson</option>
                                        <option value="dr-williams">Dr. Williams</option>
                                        <option value="dr-brown">Dr. Brown</option>
                                        <option value="dr-davis">Dr. Davis</option>
                                        <option value="dr-miller">Dr. Miller</option>
                                    </select>
                                </div><!--end of doctor dropdown-->

                               
                                <div class = "medicine-dropdown"><!--doctor dropdown-->
                                    <label 
                                        class = "form-label" 
                                        for = "medicine">
                                        <strong> Prescription: </strong>
                                    </label>
                                    <select class = "form-input" id = "medicine" name = "medicine" required>
                                        <option value = "" disabled selected> </option>
                                        <option value="Vanilla">Vanilla</option>
                                        <option value="Nabumetone">Nabumetone</option>
                                        <option value="lorazepam">lorazepam</option>
                                        <option value="Bethanechol Chloride">Bethanechol Chloride</option>
                                        <option value="Trazodone Hydrochloride">Trazodone Hydrochloride</option>
                                        <option value="Magnesium Hydroxide">Magnesium Hydroxide</option>
                                    </select>
                                </div><!--end of doctor dropdown-->

                                <!-- Date Medicine Was Last Taken -->   
                                <div>
                                    <label class="form-label" 
                                            for="last-dose">
                                            <strong>When did you take your last dose:</strong>
                                    </label>

                                    <input class="form-input"
                                           type="date" 
                                           id="last-dose" 
                                           name="last_dose" required>
                                </div>

                                <!-- Date You Need a Refill -->
                                <div>
                                    <label class="form-label" 
                                           for="refill-date">
                                           <strong>Date you need a refill:</strong>
                                    </label>

                                    <input class="form-input"
                                           type="date" 
                                           id="refill-date" 
                                           name="refill_date" required>
                                </div>

                                <!--request button-->
                                        <button type = "submit" 
                                            id = "requestPrescription" 
                                            class = "booking-btn">
                                            <strong>Request</strong>
                                        </button>

                                <!--confirmation message-->
                                <div id = "confirmation-message"
                                    role = "status" hidden>
                                    All set! See you soon!
                                </div><!--end of confirmation-message-->
                        </form>
                    </div><!--end of prescription form-->
                </section>
            </main>
            
        </div> 

            <footer style="text-align: center; background: #333; color: white; padding: 20px;">
                <p>&copy; 2026 X Hospital. All rights reserved.</p>
            </footer>

        <script src ="../js/patient.js"></script>      
    </body>

</html>
