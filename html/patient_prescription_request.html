
<!DOCTYPE html>

    <head>
        <meta charset="UTF-8">

        <title>Patient Dashboard</title>
        <link rel="stylesheet" href="../css/patient.css">
        <script src="../lib/dompurify/purify.min.js"></script>

<script src="../js/security.js" defer></script>
<script src="../js/validation.js" defer></script>
    </head>
    
    <body class="patient-dashboard" role="patient"> 
        <div id="dashWindow">

            <header >
                <a id="hosp-logo" href="login_page.html">
                    <svg viewBox="0 0 32 32" aria-hidden="true">
                        <circle cx="16" cy="16" r="16" fill="currentColor"></circle>
                        <path d="M13 7h6v6h6v6h-6v6h-6v-6H7v-6h6z" fill="#fff"></path>
                    </svg>
                    X HOSPITAL
                </a>
        
                <nav  aria-label="Patient dashboard sections">
                    <h2 class="page-title">
                        Request a Prescription
                    </h2>

                    <div class="tabs patient-tabs" >
                        <a class="tab" id="tabDash"  href="patient_page.html">Dashboard</a>
                        <a class="tab" id="tabBook" href="patient_booking.html">Booking</a>
                        <a  class="tab" id="tabPresc" aria-current="page" href="patient_prescription_request.html">Prescription</a>
                    </div> 
                </nav>
            </header>

            <main class = "patient-main">
                <a class="back" href="patient_page.html">Back to home</a>

                <section id = "requestPrescription">
                    <div id="prescription-form">
                            
                        <form  action="#" method="post">

                            <!--form fields-->
                            <h2> Prescription Form: </h2>
                             <label 
                                    class = "form-label" 
                                    for = "doctor">
                                    <strong> Doctor: </strong>
                            </label>
                                <select class = "form-input" id = "doctor" name = "doctor" required>
                                    
                                    <option value = "" >--Select a doctor--</option>
                                    <option value="Dr. Merrily Harmson">Dr. Merrily Harmson - Cardiology</option>
                                    <option value="Dr. Coordell Toor">Dr. Coordell Toor - Neurology</option>
                                    <option value="Dr. Violante Rilton">Dr. Violante Rilton - Pediatrics</option>
                                    <option value="Dr. Ettie Beardsworth">Dr. Ettie Beardsworth - Orthopedics</option>
                                    <option value="Dr. Rad Philipard">Dr. Rad Philipard - Gen. Medicine</option>
                                </select>
                             <label class="form-label" for="medicine">
                                <strong>Medication:</strong>
                            </label>
                                <select class="form-input" id="medicine" name="medicine" required>

                                    <option value="">--Select a medication--</option>

                                    <option value="1">Nabumetone</option>
                                    <option value="2">Vanilla</option>
                                    <option value="3">atovaquone and proguanil hydrochloride</option>
                                    <option value="4">lorazepam</option>
                                    <option value="5">Aconitum napellus, Onion, Arnica montana, Antropa Belladonna, Solanum Dulcamara Top, Eupatorium Cannabinum Whole Flowering, Gelsemium Sempervirens Root</option>
                                    <option value="6">BETHANECHOL CHLORIDE</option>
                                    <option value="7">Hydrocodone Bitartrate and Acetaminophen</option>
                                    <option value="8">alprazolam</option>
                                    <option value="9">Acetaminophen, Dextromethorphan HBr, Doxylamine succinate, Phenylephrine HCl</option>
                                    <option value="10">Docusate Sodium and Senna</option>
                                    <option value="11">DROSERA, ARNICA MONTANA, BRYONIA, CETRARIA ISLANDICA, BELLADONNA, COCCUS CACTI, CORALLIUM RUBRUM, STANNUM METALLICUM, CHAMOMILLA, COFFEA CRUDA</option>
                                    <option value="12">Trazodone Hydrochloride</option>
                                    <option value="13">Chlordiazepoxide Hydrochloride</option>
                                    <option value="14">Trazodone Hydrochloride</option>
                                    <option value="15">Magnesium Hydroxide</option>
                                    <option value="16">Zinc Oxide</option>
                                    <option value="17">TOBRAMYCIN SULFATE</option>
                                    <option value="18">Atomoxetine hydrochloride</option>
                                    <option value="19">CAMPHOR, EUCALYPTUS OIL and MENTHOL</option>
                                    <option value="20">Diphenhydramine Hydrochloride</option>
                                    <option value="21">lamotrigine</option>
                                    <option value="22">Acetaminophen</option>
                                    <option value="23">polyethylene glycol</option>
                                    <option value="24">Hydralazine Hydrochloride</option>
                                    <option value="25">Ramipril</option>
                                    <option value="26">CAMPHOR (NATURAL), MENTHOL,METHYL SALICYLATE</option>
                                    <option value="27">Menthol</option>
                                    <option value="28">Gabapentin</option>
                                    <option value="29">Fexofenadine HCl</option>
                                    <option value="30">Famotidine</option>
                                    <option value="31">Galantamine hydrobromide</option>
                                    <option value="32">RISPERIDONE</option>
                                    <option value="33">Amlodipine Besylate</option>
                                    <option value="34">OCTINOXATE, OCTISALATE, OXYBENZONE, OCTOCRYLENE, and AVOBENZONE</option>
                                    <option value="35">Labetalol Hydrochloride</option>
                                    <option value="36">Lovastatin</option>
                                    <option value="37">Ethyl Alcohol</option>
                                    <option value="38">Bupropion Hydrochloride</option>
                                    <option value="39">OXYBENZONE, AVOBENZONE, OCTOCRYLENE</option>
                                    <option value="40">Salicylic Acid</option>

                                </select>

                            <button type="submit" class="booking-btn">Submit Prescription</button>
                                
                        </form>
                    </div><!--end of prescription form-->
                </section>
            </main>
            
        </div> 

            <footer style="text-align: center; background: #333; color: white; padding: 20px;">

</html>
